name: Repository Automation

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze-and-document:
    name: Auto-Analyze and Update README
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt || true

      - name: Run Repository Analysis
        run: python .github/scripts/analyze_codebase.py

      - name: Generate Architecture Diagrams
        run: python .github/scripts/generate_diagrams.py

      - name: Build Knowledge Graph
        run: python .github/scripts/generate_knowledge_graph.py

      - name: Update README.md
        run: python .github/scripts/update_readme.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update architecture, diagrams, and README"
          file_pattern: "README.md docs/**/*.md docs/**/*.json"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
